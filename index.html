<!DOCTYPE html>
<html lang="nl" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Safespace - Operations Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #f8fafc; 
      padding: 20px; 
      margin: 0; 
      color: #0f172a;
    }

    .dashboard-container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* HEADER & KOETJES WEIDE */
    .fc-blue-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
    }
    .fc-blue-header h1 {
      font-size: 22px;
      margin: 0 0 12px 0;
      font-weight: 700;
    }
    .koetjes-weide {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* PRIO KANBAN BOARD */
    .prio-kanban-board {
      background: white;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }
    .column.prio-1 h3 {
      color: #dc2626;
      font-size: 16px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .column ul {
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }
    .column li {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .prio-kanban-board button {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #475569;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
    }
    .prio-kanban-board button:hover { background: #e2e8f0; }

    /* MANAGER SHIELD SECTION */
    .manager-shield-section {
      margin-top: 10px;
    }
    .shield-btn {
      background: #0f172a;
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .shield-btn:hover { background: #1e293b; transform: translateY(-1px); }

    /* VERBORGEN PRIO 2 & 3 CONTAINER */
    .prio-hidden-box {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #cbd5e1;
    }
  </style>
</head>
<body class="notranslate">

  <!-- HIER WORDT HET DASHBOARD DYNAMISCH IN GELADEN -->
  <div id="app" class="dashboard-container"></div>

  <script>
    // 1. ENGINE & HELPER MOCKS (Nodig om de class te laten werken)
    const GamificationEngine = {
      getCows: () => 18 // Voorbeeld score
    };

    const UI = {
      togglePrio: (level) => {
        const box = document.getElementById('prio23Box');
        if (box) {
          box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }
      }
    };

    const MeetingModule = {
      startSync: () => alert("🛡️ Wekelijkse Manager Sync gestart! Debrief wordt gegenereerd...")
    };

    // 2. JOUW EXACTE OPERATIONS DASHBOARD CLASS
    class OperationsDashboard {
      getTasks(prio) {
        if (prio === 1) {
          return `
            <li>📌 Trace Reports Check uitvoeren</li>
            <li>📌 Wekelijkse KPI-rapportage aanleveren</li>
          `;
        }
        return `
          <li style="background:#f8fafc; border-color:#e2e8f0; color:#475569;">Prio 2: Documentatie bijwerken</li>
          <li style="background:#f8fafc; border-color:#e2e8f0; color:#475569;">Prio 3: Archief opschonen</li>
        `;
      }

      render() {
        return `
          <div class="fc-blue-header">
            <h1>Welkom terug, Alain! 👋</h1>
            <div class="koetjes-weide">
               🐄 Huidige Score: ${GamificationEngine.getCows()} / 50 Koetjes
               <br> 🎁 Doel: Etentje met Pa, Ma & Watchers
            </div>
          </div>

          <div class="prio-kanban-board">
            <!-- Prio 1: Mag NOOIT stagneren -->
            <div class="column prio-1">
              <h3>🔥 Prio 1 (Doen)</h3>
              <ul>${this.getTasks(1)}</ul>
            </div>
            
            <!-- Prio 2 & 3 verborgen voor rust in het hoofd, klik om uit te klappen -->
            <button onclick="UI.togglePrio(2)">Bekijk Prio 2 & 3</button>

            <div id="prio23Box" class="prio-hidden-box">
              <h4 style="margin: 0 0 8px 0; color: #475569; font-size: 13px;">📋 Prio 2 & 3 Taken</h4>
              <ul style="margin:0;">${this.getTasks(2)}</ul>
            </div>
          </div>

          <div class="manager-shield-section">
            <button class="shield-btn" onclick="MeetingModule.startSync()">
              🛡️ Start Wekelijkse Manager Sync (Genereer Debrief)
            </button>
          </div>
        `;
      }
    }

    // 3. LAAD HET DASHBOARD DIRECT IN DE PAGINA
    document.addEventListener("DOMContentLoaded", () => {
      const dashboard = new OperationsDashboard();
      document.getElementById('app').innerHTML = dashboard.render();
    });
  </script>
</body>
</html>
