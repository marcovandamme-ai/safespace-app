<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veilige Ruimte App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- App Container -->
    <div id="app" class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- Navigation / Header -->
        <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
            <div class="flex items-center gap-3">
                <div id="user-avatar" class="w-10 h-10 bg-indigo-600 text-white font-bold rounded-xl flex items-center justify-center text-sm">
                    VR
                </div>
                <div>
                    <h1 id="user-display-name" class="font-bold text-slate-900 text-sm">Veilige Ruimte</h1>
                    <p id="dash-program-title" class="text-[10px] font-bold text-indigo-600 uppercase">Dashboard</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <div class="bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl flex items-center gap-1.5">
                    <span id="dash-program-icon">⭐</span>
                    <span id="dash-points-display" class="font-bold text-amber-700 text-xs">50</span>
                    <span class="text-[10px] text-amber-600 font-medium">ptn</span>
                </div>
                <button id="nav-btn-dashboard" onclick="switchTab('dashboard')" class="px-4 py-2 rounded-xl bg-blue-600 text-white shadow-md flex items-center gap-2 font-bold text-xs">
                    Dashboard
                </button>
                <button id="nav-btn-configuratie" onclick="switchTab('configuratie')" class="px-3 py-2 rounded-xl border border-slate-300 hover:bg-slate-100 text-slate-700 flex items-center gap-1.5 ml-2">
                    Configuratie
                </button>
            </div>
        </header>

        <!-- DASHBOARD TAB -->
        <main id="tab-dashboard" class="tab-content space-y-6 hidden">
            <div class="bg-indigo-600 text-white p-6 rounded-3xl shadow-lg flex justify-between items-center">
                <div>
                    <span id="dash-target-name" class="text-xs text-indigo-200 font-medium uppercase tracking-wider block">Huidig Doel</span>
                    <h2 id="dash-target-points" class="text-2xl font-black mt-1">Doel: 100 ptn</h2>
                </div>
                <div class="text-3xl">🎯</div>
            </div>
        </main>

        <!-- CONFIGURATIE TAB -->
        <main id="tab-configuratie" class="tab-content space-y-6">
            <!-- Subnavigatie -->
            <div class="flex gap-2 border-b border-slate-200 pb-3">
                <button id="subtab-btn-stakeholders" onclick="switchConfigSubTab('stakeholders')" class="font-bold text-xs px-4 py-2 rounded-xl bg-indigo-100 text-indigo-700">
                    Stakeholders
                </button>
                <button id="subtab-btn-deliverables" onclick="switchConfigSubTab('deliverables')" class="font-bold text-xs px-4 py-2 rounded-xl text-slate-500 hover:bg-slate-100">
                    Deliverables
                </button>
                <button id="subtab-btn-spaarprogramma" onclick="switchConfigSubTab('spaarprogramma')" class="font-bold text-xs px-4 py-2 rounded-xl text-slate-500 hover:bg-slate-100">
                    Spaarprogramma
                </button>
            </div>

            <!-- Subtab Stakeholders -->
            <section id="config-subtab-stakeholders" class="config-subtab space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-sm">Belanghebbenden Overview</h3>
                    <button onclick="openModal('modal-stakeholder')" class="px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700">+ Nieuwe Stakeholder</button>
                </div>
                <div id="stakeholders-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dynamic Content -->
                </div>
            </section>

            <!-- Subtab Deliverables -->
            <section id="config-subtab-deliverables" class="config-subtab space-y-4 hidden">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-sm">Deliverables Overview</h3>
                    <button onclick="openModal('modal-deliverable')" class="px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700">+ Nieuwe Deliverable</button>
                </div>
                <div id="deliverables-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dynamic Content -->
                </div>
            </section>

            <!-- Subtab Spaarprogramma -->
            <section id="config-subtab-spaarprogramma" class="config-subtab space-y-4 hidden">
                <form onsubmit="saveSpaarprogramma(event)" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 max-w-md">
                    <h3 class="font-bold text-slate-800 text-sm">Spaarprogramma Instellingen</h3>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Programma Naam</label>
                        <input id="prog-naam" type="text" required value="Spaarprogramma" class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Icoon (Emoji)</label>
                        <input id="prog-icon" type="text" required value="⭐" class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Doel Titel</label>
                        <input id="target-title" type="text" required value="Beloning Behaald" class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Doel Punten</label>
                        <input id="target-pts" type="number" required value="100" class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                    </div>
                    <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Opslaan</button>
                </form>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-stakeholder" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white p-6 rounded-3xl max-w-md w-full space-y-4">
            <h3 class="font-bold text-slate-900">Stakeholder Toevoegen</h3>
            <form onsubmit="saveStakeholder(event)" class="space-y-3">
                <input id="stk-naam" type="text" placeholder="Naam" required class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                <input id="stk-rol" type="text" placeholder="Rol" required class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                <input id="stk-disc" type="text" placeholder="DISC Profiel (bijv. D/I)" class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                <input id="stk-nlp" type="text" placeholder="NLP Voorkeurskanaal" class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                <input id="stk-stijl" type="text" placeholder="Communicatiestijl" class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                <textarea id="stk-weetjes" placeholder="Weetjes / Notities" class="w-full p-2 border border-slate-200 rounded-xl text-xs"></textarea>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal('modal-stakeholder')" class="w-1/2 py-2 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold">Annuleren</button>
                    <button type="submit" class="w-1/2 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Opslaan</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-deliverable" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white p-6 rounded-3xl max-w-md w-full space-y-4">
            <h3 class="font-bold text-slate-900">Deliverable Toevoegen</h3>
            <form onsubmit="saveDeliverable(event)" class="space-y-3">
                <input id="del-titel" type="text" placeholder="Titel" required class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                <input id="del-frequentie" type="text" placeholder="Frequentie (bijv. Wekelijks)" class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                <input id="del-format" type="text" placeholder="Format (bijv. PDF)" class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                <select id="del-stakeholder" class="w-full p-2 border border-slate-200 rounded-xl text-xs"></select>
                <input id="del-precheck" type="date" placeholder="Pre-check Datum" class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                <input id="del-deadline" type="date" required class="w-full p-2 border border-slate-200 rounded-xl text-xs">
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal('modal-deliverable')" class="w-1/2 py-2 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold">Annuleren</button>
                    <button type="submit" class="w-1/2 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Opslaan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/stakeholders.js"></script>
    <script src="js/deliverables.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
