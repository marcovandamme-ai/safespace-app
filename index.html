<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSpace Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500/20 p-2 rounded-xl text-emerald-400">
                    <i class="fa-solid fa-shield-heart text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none">SafeSpace</h1>
                    <span class="text-xs text-slate-400">Veilige omgeving</span>
                </div>
            </div>
            <div id="status-badge" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Alles Rustig
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main class="max-w-4xl mx-auto p-4 space-y-6 mt-4">

        <!-- Welkomstkaart -->
        <div class="bg-gradient-to-r from-slate-900 to-slate-800 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-2xl font-bold text-emerald-400 mb-1">Welkom bij SafeSpace 👋</h2>
            <p class="text-slate-300 text-sm">Een centrale, veilige plek voor ondersteuning, communicatie en overzicht.</p>
        </div>

        <!-- Snelactie: Status Aanpassen -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Hoe gaat het nu?</h3>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="updateStatus('Alles Rustig', 'emerald')" class="flex flex-col items-center justify-center p-3 bg-slate-800/60 hover:bg-emerald-900/30 border border-slate-700/50 hover:border-emerald-500/50 rounded-xl transition-all">
                    <span class="text-2xl mb-1">😊</span>
                    <span class="text-xs font-medium text-slate-200">Gaat Goed</span>
                </button>
                <button onclick="updateStatus('Twijfel / Overleg', 'amber')" class="flex flex-col items-center justify-center p-3 bg-slate-800/60 hover:bg-amber-900/30 border border-slate-700/50 hover:border-amber-500/50 rounded-xl transition-all">
                    <span class="text-2xl mb-1">😐</span>
                    <span class="text-xs font-medium text-slate-200">Twijfel</span>
                </button>
                <button onclick="updateStatus('Hulp Nodig', 'rose')" class="flex flex-col items-center justify-center p-3 bg-slate-800/60 hover:bg-rose-900/30 border border-slate-700/50 hover:border-rose-500/50 rounded-xl transition-all">
                    <span class="text-2xl mb-1">🆘</span>
                    <span class="text-xs font-medium text-slate-200">Hulp Nodig</span>
                </button>
            </div>
        </div>

        <!-- Berichten & Updates -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Laatste Berichten</h3>
            
            <!-- Invoer veld -->
            <div class="flex gap-2 mb-4">
                <input id="message-input" type="text" placeholder="Typ hier een nieuw bericht..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-all">
                <button onclick="addMessage()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition-all flex items-center gap-2">
                    <span>Verstuur</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

            <!-- Berichten Lijst -->
            <div id="messages-list" class="space-y-3">
                <div class="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-semibold text-emerald-400">Systeem</span>
                        <span class="text-[10px] text-slate-500">Zojuist</span>
                    </div>
                    <p class="text-sm text-slate-300">SafeSpace app is succesvol ingericht en gereed voor gebruik!</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Script voor basis interactie -->
    <script>
        function updateStatus(tekst, kleur) {
            const badge = document.getElementById('status-badge');
            let colorClasses = {
                'emerald': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
                'amber': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                'rose': 'bg-rose-500/10 text-rose-400 border-rose-500/20'
            };
            
            badge.className = `px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-2 border ${colorClasses[kleur]}`;
            badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-${kleur}-400 animate-pulse"></span> ${tekst}`;
        }

        function addMessage() {
            const input = document.getElementById('message-input');
            const list = document.getElementById('messages-list');
            
            if (input.value.trim() !== '') {
                const now = new Date();
                const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                
                const msgHTML = `
                    <div class="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl animate-fade-in">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-semibold text-slate-300">Bericht</span>
                            <span class="text-[10px] text-slate-500">${timeStr}</span>
                        </div>
                        <p class="text-sm text-slate-200">${input.value}</p>
                    </div>
                `;
                
                list.insertAdjacentHTML('afterbegin', msgHTML);
                input.value = '';
            }
        }
    </script>
</body>
</html>
