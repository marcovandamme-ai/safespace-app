<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deliverables Planner & Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary: #2563eb;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1, h2 {
            color: #1e293b;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #64748b;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        button.btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button.btn-primary:hover {
            background-color: #1d4ed8;
        }

        /* Views Toggle */
        .view-picker {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .view-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
        }

        .view-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8fafc;
            color: #475569;
        }

        /* Traffic Lights */
        .light {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .light-green { background-color: #22c55e; box-shadow: 0 0 8px #22c55e88; }
        .light-orange { background-color: #f97316; box-shadow: 0 0 8px #f9731688; }
        .light-red { background-color: #ef4444; box-shadow: 0 0 8px #ef444488; }

        .status-cell {
            display: flex;
            align-items: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📌 Deliverables & Planning Dashboard</h1>

    <!-- Formulier voor Alain -->
    <div class="card">
        <h2>Nieuwe Deliverable / Planning Invoeren</h2>
        <form id="deliverableForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="title">Deliverable Naam</label>
                    <input type="text" id="title" placeholder="bv. Maandrapportage" required>
                </div>
                <div class="form-group">
                    <label for="freq">Frequentie</label>
                    <select id="freq">
                        <option value="Dagelijks">Dagelijks</option>
                        <option value="Wekelijks">Wekelijks</option>
                        <option value="Maandelijks">Maandelijks</option>
                        <option value="Kwartaal">Kwartaal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="startDate">Geplande Startdatum</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="form-group">
                    <label for="duration">Verwachte Duur (Uren)</label>
                    <input type="number" id="duration" min="0.5" step="0.5" placeholder="bv. 4" required>
                </div>
                <div class="form-group">
                    <label for="deadline">Deadline</label>
                    <input type="date" id="deadline" required>
                </div>
            </div>
            <button type="submit" class="btn-primary">Deliverable Toevoegen aan Planning</button>
        </form>
    </div>

    <!-- Planner Dashboard -->
    <div class="card">
        <h2>🗓️ Planner Alain</h2>
        
        <!-- Filter Knoppen -->
        <div class="view-picker">
            <button class="view-btn active" onclick="setView('all', this)">Alles</button>
            <button class="view-btn" onclick="setView('Dagelijks', this)">Dagbasis</button>
            <button class="view-btn" onclick="setView('Wekelijks', this)">Weekbasis</button>
            <button class="view-btn" onclick="setView('Maandelijks', this)">Maandbasis</button>
        </div>

        <!-- Tabel met Deliverables -->
        <table>
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Deliverable</th>
                    <th>Frequentie</th>
                    <th>Startdatum</th>
                    <th>Geplande Duur</th>
                    <th>Deadline</th>
                </tr>
            </thead>
            <tbody id="deliverableTable">
                <!-- Data wordt hier dynamisch geladen -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Voorbeelddata
    let deliverables = [
        { title: "Dagelijkse Standup & Check", freq: "Dagelijks", startDate: "2026-03-30", duration: "0.5 uur", deadline: "2026-03-30" },
        { title: "Wekelijkse Voortgangsupdate", freq: "Wekelijks", startDate: "2026-04-01", duration: "2 uur", deadline: "2026-04-03" },
        { title: "Financiële Maandrapportage", freq: "Maandelijks", startDate: "2026-04-05", duration: "6 uur", deadline: "2026-04-08" }
    ];

    let currentFilter = 'all';

    // Bepaal de status van het stoplicht
    function getStatusLight(startDateStr, deadlineStr) {
        const today = new Date().toISOString().split('T')[0];
        
        if (deadlineStr < today) {
            return `<div class="status-cell"><span class="light light-red"></span> Te laat / Actie!</div>`;
        } else if (startDateStr <= today && deadlineStr >= today) {
            return `<div class="status-cell"><span class="light light-orange"></span> In behandeling</div>`;
        } else {
            return `<div class="status-cell"><span class="light light-green"></span> Ingepland</div>`;
        }
    }

    // Render de tabel
    function renderTable() {
        const tbody = document.getElementById('deliverableTable');
        tbody.innerHTML = '';

        const filteredData = currentFilter === 'all' 
            ? deliverables 
            : deliverables.filter(item => item.freq === currentFilter);

        filteredData.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${getStatusLight(item.startDate, item.deadline)}</td>
                <td><strong>${item.title}</strong></td>
                <td>${item.freq}</td>
                <td>${item.startDate}</td>
                <td>${item.duration}</td>
                <td>${item.deadline}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // Filter wisselen (Dag, Week, Maand)
    function setView(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTable();
    }

    // Formulier afhandeling
    document.getElementById('deliverableForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const newDeliverable = {
            title: document.getElementById('title').value,
            freq: document.getElementById('freq').value,
            startDate: document.getElementById('startDate').value,
            duration: document.getElementById('duration').value + " uur",
            deadline: document.getElementById('deadline').value
        };

        deliverables.push(newDeliverable);
        renderTable();
        this.reset();
    });

    // Eerste render bij het laden van de pagina
    renderTable();
</script>

</body>
</html>
