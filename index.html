<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sfeer Task Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.8s ease, color 0.5s ease;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Dynamische Achtergronden op basis van Takenstatus */
        body.bg-zon {
            background: linear-gradient(135deg, #ffde59, #ff914d);
            color: #333;
        }

        body.bg-bewolkt {
            background: linear-gradient(135deg, #a8c0ff, #3f2b96);
            color: #fff;
        }

        body.bg-regen {
            background: linear-gradient(135deg, #4b6cb7, #182848);
            color: #fff;
        }

        body.bg-onweer {
            background: linear-gradient(135deg, #232526, #414345);
            color: #ff5252;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: inherit;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .kpi-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .kpi-item {
            text-align: center;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], select {
            padding: 10px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        input[type="text"] {
            flex: 1;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background-color: #28a745;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        ul {
            list-style: none;
        }

        li {
            background: rgba(255, 255, 255, 0.2);
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li.done span {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-urgent {
            background: #ff4d4d;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .btn-delete {
            background: #dc3545;
            padding: 5px 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body id="app-body">

    <div class="container">
        <h1>Mijn Taken</h1>
        
        <!-- KPI Dashboard -->
        <div class="kpi-board">
            <div class="kpi-item">
                <div id="kpi-progress" class="kpi-value">0%</div>
                <div>Voortgang</div>
            </div>
            <div class="kpi-item">
                <div id="kpi-status" class="kpi-value">Laden...</div>
                <div>Sfeer</div>
            </div>
        </div>

        <!-- Invoer Veld -->
        <div class="input-group">
            <input type="text" id="task-input" placeholder="Nieuwe taak toevoegen...">
            <select id="priority-select">
                <option value="Normal">Normaal</option>
                <option value="Urgent">Urgent</option>
            </select>
            <button onclick="addTask()">+</button>
        </div>

        <!-- Takenlijst -->
        <ul id="task-list"></ul>
    </div>

    <script>
        // Initiële takenlijst
        let tasks = [
            { id: 1, text: "Systeem initialiseren", done: true, priority: "Normal" },
            { id: 2, text: "Kijken naar takenstatus bij laden", done: false, priority: "Urgent" },
            { id: 3, text: "Achtergrond automatisch aanpassen", done: false, priority: "Normal" }
        ];

        // 1. Functie die DE STATUS UITLEEST, KPI BEREKENT en ACHTERGROND DIRECT AANPAST
        function updateSfeerEnAchtergrond() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.done).length;
            const heeftUrgentie = tasks.some(t => !t.done && t.priority === 'Urgent');
            const percentage = total > 0 ? Math.round((completed / total) * 100) : 100;

            const body = document.getElementById('app-body');
            const kpiProgress = document.getElementById('kpi-progress');
            const kpiStatus = document.getElementById('kpi-status');

            // Reset achtergrondklassen
            body.className = '';

            // Update KPI voortgang
            kpiProgress.innerText = `${percentage}%`;

            // Bepaal sfeer op basis van actuele taken
            if (heeftUrgentie) {
                body.classList.add('bg-onweer');
                kpiStatus.innerText = '⚡ Onweer';
            } else if (percentage === 100) {
                body.classList.add('bg-zon');
                kpiStatus.innerText = '☀️ Zonnig';
            } else if (percentage >= 40) {
                body.classList.add('bg-bewolkt');
                kpiStatus.innerText = '☁️ Bewolkt';
            } else {
                body.classList.add('bg-regen');
                kpiStatus.innerText = '🌧️ Regen';
            }
        }

        // 2. Render de taken in de lijst
        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';

            tasks.forEach(task => {
                const li = document.createElement('li');
                if (task.done) li.classList.add('done');

                li.innerHTML = `
                    <div class="task-info">
                        <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id})">
                        <span>${task.text}</span>
                        ${task.priority === 'Urgent' && !task.done ? '<span class="badge-urgent">URGENT</span>' : ''}
                    </div>
                    <button class="btn-delete" onclick="deleteTask(${task.id})">X</button>
                `;
                list.appendChild(li);
            });

            // Pas direct de achtergrond en status aan na het renderen!
            updateSfeerEnAchtergrond();
        }

        // 3. Acties
        function addTask() {
            const input = document.getElementById('task-input');
            const priority = document.getElementById('priority-select').value;
            const text = input.value.trim();

            if (text !== '') {
                tasks.push({ id: Date.now(), text: text, done: false, priority: priority });
                input.value = '';
                renderTasks();
            }
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        // 4. DIRECT BIJ METEEN LADEN VAN DE PAGINA UITVOEREN
        document.addEventListener('DOMContentLoaded', () => {
            renderTasks();
        });
    </script>
</body>
</html>
